name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Verify Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install pinned templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.977

      - name: Build Tailwind CSS
        run: npx @tailwindcss/cli -i ./web/static/css/input.css -o ./web/static/css/output.css --minify

      - name: Generate templ files
        run: templ generate

      - name: Run go vet
        run: go vet ./...

      - name: Run Go test suite
        run: go test -race -count=1 ./...

  build-binaries:
    name: Build Static Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            bin: wledger
            ext: tar.gz
          - goos: linux
            goarch: arm64
            bin: wledger
            ext: tar.gz
          - goos: darwin
            goarch: arm64
            bin: wledger
            ext: tar.gz
          - goos: darwin
            goarch: amd64
            bin: wledger
            ext: tar.gz
          - goos: windows
            goarch: amd64
            bin: wledger.exe
            ext: zip
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install pinned templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.977

      - name: Build Tailwind CSS and templ
        run: |
          npx @tailwindcss/cli -i ./web/static/css/input.css -o ./web/static/css/output.css --minify
          templ generate

      - name: Cross-compile static binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p stage release-assets
          go build -trimpath -ldflags="-s -w" -o "stage/${{ matrix.bin }}" ./cmd/server
          cp README.md LICENSE stage/
          archive="wledger_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.ext }}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd stage && zip -q "../release-assets/${archive}" "${{ matrix.bin }}" README.md LICENSE)
          else
            tar -C stage -czf "release-assets/${archive}" "${{ matrix.bin }}" README.md LICENSE
          fi

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-assets/*

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          merge-multiple: true
          path: release-assets

      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: sha256sum wledger_* > SHA256SUMS.txt

      - name: Create GitHub Release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*

  build-and-push:
    name: Build & Push Multi-Arch Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/wledger
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
