services:
  wledger:
    image: tuxedomakes/wledger:latest
    container_name: wledger

    # Linux LAN mDNS discovery (_wled._tcp.local. and .local hostnames):
    # On Linux hosts, uncomment network_mode: host and comment out ports: below.
    # (On macOS/Windows Docker runs in a VM, so add controllers by LAN IP or run the native binary for mDNS.)
    # network_mode: host

    ports:
      # Maps HOST:CONTAINER (adjust if overriding WLEDGER_PORT)
      - "8080:8080"

    # Optional environment configuration (all have safe defaults when unset):
    # environment:
    #   # Server listen port or address (default: 8080)
    #   WLEDGER_PORT: "8080"
    #
    #   # Built-in self-signed ECDSA P-256 HTTPS (persisted in /wledger/data/tls).
    #   # Recommended on LAN so mobile camera barcode scanning & clipboard APIs work over HTTPS.
    #   WLEDGER_TLS_SELF_SIGNED: "true"
    #
    #   # Or provide custom TLS certificate/key paths inside the container:
    #   # WLEDGER_TLS_CERT: "/wledger/data/tls/cert.pem"
    #   # WLEDGER_TLS_KEY: "/wledger/data/tls/key.pem"
    #
    #   # Reverse proxy support: trust X-Forwarded-For / X-Real-IP headers and mark session cookies Secure
    #   # WLEDGER_TRUST_PROXY: "true"
    #   # WLEDGER_COOKIE_SECURE: "true"
    #
    #   # Optional storage path overrides (defaults shown):
    #   # WLEDGER_DATA_DIR: "/wledger/data"
    #   # WLEDGER_DB_PATH: "/wledger/data/wledger.db"
    #   # WLEDGER_UPLOADS_DIR: "/wledger/app/uploads"

    volumes:
      # Persist SQLite database and generated TLS certificates
      # Note: container runs as non-root UID 10001; ensure host directories are writable
      - ./data:/wledger/data
      # Persist uploaded part images and datasheets/documents
      - ./uploads:/wledger/app/uploads

    restart: unless-stopped
